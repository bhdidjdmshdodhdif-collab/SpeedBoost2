name: Build SpeedBoost APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (extract ZIP if needed)
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Project found at repository root."
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mkdir -p "$RUNNER_TEMP/extracted"
            while IFS= read -r -d '' zipfile; do
              echo "Inspecting ZIP: $zipfile"
              listing="$(unzip -Z1 "$zipfile" || true)"
              if grep -Eq '(^|/)settings\.gradle(\.kts)?$' <<< "$listing"; then
                dest="$RUNNER_TEMP/extracted/$(basename "$zipfile" .zip)"
                rm -rf "$dest"
                mkdir -p "$dest"
                unzip -q -o "$zipfile" -d "$dest"
                settings_file="$(find "$dest" -maxdepth 4 -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
                if [ -n "$settings_file" ]; then
                  PROJECT_DIR="$(dirname "$settings_file")"
                  echo "Extracted project to: $PROJECT_DIR"
                  break
                fi
              fi
            done < <(find . -path ./.git -prune -o -type f -iname '*.zip' -print0)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Gradle project found. Upload the project ZIP (containing settings.gradle.kts) to the repository root."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error::APK not found after build."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/SpeedBoost-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedBoost-debug-apk
          path: dist/SpeedBoost-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports
          if-no-files-found: ignore
